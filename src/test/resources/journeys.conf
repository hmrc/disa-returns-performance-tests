# Configure here your journeys. A journey is a sequence of requests at a certain load.

journeys {
  post-submit-monthly-returns = {
  description = "Submit monthly returns journey"
      load = 10
      parts = [
        post-submit-monthly-returns
      ]
  },
  post-declare-monthly-returns = {
  description = "Declare monthly returns journey"
      load = 1
      parts = [
        post-declare-monthly-returns
      ]
  },
  get-report-summary-callback-and-summary = {
    description = "NPS retrieve monthly summary and NPS callback journey"
      load = 5
      parts = [
        get-report-summary-callback-and-summary
      ]
  },
  get-reconciliation-report = {
    description = "Get Reconciliation report journey"
      load = 5
      parts = [
        get-reconciliation-report
      ]
  }
}


# Default behaviour is to run all journeys. If that is not what you need you can specify the list of journeys to run
journeysToRun = [
   post-submit-monthly-returns,
   post-declare-monthly-returns,
   get-report-summary-callback-and-summary,
   get-reconciliation-report
]
